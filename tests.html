<!doctype html><html lang="el"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DayFlow checks</title><body style="font:16px system-ui;max-width:700px;margin:40px auto;padding:0 18px"><h1>DayFlow — quick checks</h1><p>Άνοιξε αυτή τη σελίδα αφού ανοίξεις την εφαρμογή στο ίδιο browser.</p><button id="run">Εκτέλεση ελέγχων</button><pre id="out"></pre><script>document.querySelector('#run').onclick=()=>{const out=document.querySelector('#out');let r=[];try{const d=JSON.parse(localStorage.getItem('dayflow-v2-data'));r.push(['Local data exists',!!d]);r.push(['Tasks array',Array.isArray(d?.tasks)]);r.push(['Events array',Array.isArray(d?.events)]);r.push(['Clients array',Array.isArray(d?.clients)]);r.push(['Projects array',Array.isArray(d?.projects)]);r.push(['Task entries have IDs',d?.tasks.every(x=>!!x.id)]);}catch(e){r.push(['Local data readable',false])}out.textContent=r.map(x=>(x[1]?'PASS':'CHECK')+' — '+x[0]).join('\\n')+'\\n\\nThese are smoke checks, not full device QA.'}</script></body></html>
